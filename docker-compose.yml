# Local dev database only. Deployed environments use Neon (pooled connection
# string, via Doppler) — see .agents/context/engineering/overview/infra-and-envs.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: batuto
      POSTGRES_PASSWORD: batuto
      POSTGRES_DB: batuto_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batuto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
