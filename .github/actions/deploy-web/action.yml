name: Deploy web to Vercel
description: >
  Downloads a prebuilt Vercel build artifact (produced by a prior
  `vercel build` step) and deploys it via `vercel deploy --prebuilt` —
  Vercel never sees or builds from source. Assumes release (database
  migrations) already succeeded.

inputs:
  artifact-name:
    description: Name of the build-output artifact uploaded by the build step
    required: true
  vercel-token:
    required: true
  vercel-org-id:
    required: true
  vercel-project-id:
    required: true
  production:
    description: "'true' for a Vercel production deploy, 'false' for preview"
    required: false
    default: "false"
  github-token:
    description: GitHub token, for creating a GitHub Deployment and PR comment
    required: true
  deployment-environment:
    description: GitHub Deployment environment name, e.g. Production-web, pr-8-web
    required: true
  pr-number:
    description: Pull request number to comment on; leave empty outside PR review deploys
    required: false
    default: ""

outputs:
  preview-url:
    description: The deployed Vercel URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    # Downloads into apps/web/.vercel (not just .../output): the build
    # job's "Upload build output" step includes .vercel/project.json
    # alongside .vercel/output specifically so this job gets a real,
    # local Vercel project link, not just the build artifacts. See the
    # comment on the deploy step below for why that link matters.
    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: apps/web/.vercel

    - name: Install Vercel CLI
      shell: bash
      run: npm install --global vercel@latest

    # working-directory: apps/web, same as the build job's vercel
    # pull/build steps — and for the same reason those work: cwd has a
    # local .vercel/project.json (downloaded above), so vercel deploy
    # treats cwd as the already-linked project root and reads
    # .vercel/output relative to it directly, no server lookup needed.
    # Without a local project.json, VERCEL_ORG_ID/VERCEL_PROJECT_ID env
    # vars make vercel deploy re-derive the project's Root Directory
    # (apps/web) from the API instead — and depending on cwd at that
    # point, that either doubles onto an already-apps/web cwd (a
    # nonexistent apps/web/apps/web path) or, run from repo root,
    # resolves the project directory correctly but then still looks for
    # prebuilt output at plain .vercel/output relative to cwd — repo
    # root, not apps/web — and fails to find it there either. Both
    # confirmed via real CI failures; carrying the real project.json
    # forward sidesteps the inconsistency entirely instead of chasing
    # cwd math that has to match undocumented CLI internals.
    - name: Deploy prebuilt to Vercel
      id: deploy
      shell: bash
      working-directory: apps/web
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        url=$(vercel deploy --prebuilt ${{ inputs.production == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Notify GitHub deployment
      uses: ./.github/actions/notify-deploy
      with:
        github-token: ${{ inputs.github-token }}
        environment: ${{ inputs.deployment-environment }}
        ref: ${{ github.sha }}
        target-url: ${{ steps.deploy.outputs.url }}
        description: Vercel
        pr-number: ${{ inputs.pr-number }}
