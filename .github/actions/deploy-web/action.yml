name: Deploy web to Vercel
description: >
  Downloads a prebuilt Vercel build artifact (produced by a prior
  `vercel build` step) and deploys it via `vercel deploy --prebuilt` —
  Vercel never sees or builds from source. Assumes release (database
  migrations) already succeeded.

inputs:
  artifact-name:
    description: Name of the build-output artifact uploaded by the build step
    required: true
  vercel-token:
    required: true
  vercel-org-id:
    required: true
  vercel-project-id:
    required: true
  production:
    description: "'true' for a Vercel production deploy, 'false' for preview"
    required: false
    default: "false"
  github-token:
    description: GitHub token, for creating a GitHub Deployment and PR comment
    required: true
  deployment-environment:
    description: GitHub Deployment environment name, e.g. Production-web, pr-8-web
    required: true
  pr-number:
    description: Pull request number to comment on; leave empty outside PR review deploys
    required: false
    default: ""

outputs:
  preview-url:
    description: The deployed Vercel URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: apps/web/.vercel/output

    - name: Install Vercel CLI
      shell: bash
      run: npm install --global vercel@latest

    # Deliberately NOT working-directory: apps/web here, unlike the build
    # job's vercel pull/build steps. Those work from apps/web because
    # `vercel pull` first writes a local .vercel/project.json there,
    # which vercel build then trusts as-is (cwd IS the project root,
    # already linked — no server lookup needed). This step has no local
    # project.json (only .vercel/output was downloaded, not project.json)
    # — VERCEL_ORG_ID/VERCEL_PROJECT_ID env vars make vercel deploy
    # fetch the project's settings from the API instead, which include
    # its server-side Root Directory (apps/web). Vercel then looks for
    # the prebuilt output at <cwd>/<rootDirectory>/.vercel/output. Run
    # from repo root, that resolves to apps/web/.vercel/output — right
    # where the artifact was downloaded. Running this from apps/web
    # instead (as an earlier version of this action did) applies that
    # same apps/web offset a second time, producing a nonexistent
    # apps/web/apps/web path — confirmed via a real CI failure, twice,
    # once through BetaHuhn/deploy-to-vercel-action's WORKING_DIRECTORY
    # input and once through this step's own working-directory before
    # this fix.
    - name: Deploy prebuilt to Vercel
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        url=$(vercel deploy --prebuilt ${{ inputs.production == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Notify GitHub deployment
      uses: ./.github/actions/notify-deploy
      with:
        github-token: ${{ inputs.github-token }}
        environment: ${{ inputs.deployment-environment }}
        ref: ${{ github.sha }}
        target-url: ${{ steps.deploy.outputs.url }}
        description: Vercel
        pr-number: ${{ inputs.pr-number }}
