name: Deploy API to Heroku
description: >
  Promotes an already-pushed Docker image to a Heroku app
  (registry.heroku.com/<app>/web). Assumes build-api already pushed that
  image and release (database migrations) already succeeded — this action
  only does the platform deploy itself.

inputs:
  heroku-api-key:
    description: Heroku API key (from a repository secret)
    required: true
  heroku-app-name:
    description: Name of the Heroku app to deploy to
    required: true

runs:
  using: composite
  steps:
    - name: Install Heroku CLI
      shell: bash
      run: command -v heroku >/dev/null 2>&1 || (curl https://cli-assets.heroku.com/install.sh | sh)

    - name: Log in to Heroku Container Registry
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku-api-key }}
      run: heroku container:login

    # container:release inspects the image via the local Docker daemon,
    # not the registry — the caller's job needs to be the one build-api
    # pushed from, or has to have pulled the image itself before calling
    # this action (see `docker pull` below).
    - name: Pull built image
      shell: bash
      env:
        HEROKU_APP_NAME: ${{ inputs.heroku-app-name }}
      run: docker pull "registry.heroku.com/$HEROKU_APP_NAME/web"

    # `container:release` is Heroku's own CLI command name for "deploy
    # this image" — every Heroku deploy creates a Release object, that's
    # just Heroku's product terminology. This is NOT Heroku's separate,
    # opt-in release-phase hook feature — nothing in this repo's deploy
    # pipeline uses that; migrations run as their own explicit step,
    # entirely separate from this action, before it's ever called.
    - name: Deploy image to Heroku
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku-api-key }}
        HEROKU_APP_NAME: ${{ inputs.heroku-app-name }}
      run: heroku container:release web --app "$HEROKU_APP_NAME"
