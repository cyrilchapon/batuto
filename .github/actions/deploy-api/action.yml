name: Deploy API to Heroku
description: >
  Promotes an already-pushed Docker image to a Heroku app
  (registry.heroku.com/<app>/web). Assumes build-api already pushed that
  image and release (database migrations) already succeeded — this action
  only does the platform deploy itself.

inputs:
  heroku-api-key:
    description: Heroku API key (from a repository secret)
    required: true
  heroku-app-name:
    description: Name of the Heroku app to deploy to
    required: true
  github-token:
    description: GitHub token, for creating a GitHub Deployment and PR comment
    required: true
  deployment-environment:
    description: GitHub Deployment environment name, e.g. Production-api, pr-8-api
    required: true
  pr-number:
    description: Pull request number to comment on; leave empty outside PR review deploys
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Heroku CLI
      shell: bash
      run: command -v heroku >/dev/null 2>&1 || (curl https://cli-assets.heroku.com/install.sh | sh)

    - name: Log in to Heroku Container Registry
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku-api-key }}
      run: heroku container:login

    # container:release inspects the image via the local Docker daemon,
    # not the registry — the caller's job needs to be the one build-api
    # pushed from, or has to have pulled the image itself before calling
    # this action (see `docker pull` below).
    #
    # registry.heroku.com has been observed to stall mid-pull (real CI
    # runs sat past an hour with no output and no error, eventually only
    # ending via GitHub Actions' own 6-hour job timeout). Bounding each
    # attempt with `timeout` and retrying a few times turns that into a
    # bounded, visible failure instead of a silent multi-hour hang.
    - name: Pull built image
      shell: bash
      env:
        HEROKU_APP_NAME: ${{ inputs.heroku-app-name }}
      run: |
        image="registry.heroku.com/$HEROKU_APP_NAME/web"
        for attempt in 1 2 3; do
          if timeout 5m docker pull "$image"; then
            exit 0
          fi
          echo "::warning::docker pull attempt $attempt for $image timed out or failed"
          sleep 10
        done
        echo "::error::docker pull for $image failed after 3 attempts"
        exit 1

    # `container:release` is Heroku's own CLI command name for "deploy
    # this image" — every Heroku deploy creates a Release object, that's
    # just Heroku's product terminology. This is NOT Heroku's separate,
    # opt-in release-phase hook feature — nothing in this repo's deploy
    # pipeline uses that; migrations run as their own explicit step,
    # entirely separate from this action, before it's ever called.
    - name: Deploy image to Heroku
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku-api-key }}
        HEROKU_APP_NAME: ${{ inputs.heroku-app-name }}
      run: heroku container:release web --app "$HEROKU_APP_NAME"

    - name: Notify GitHub deployment
      uses: ./.github/actions/notify-deploy
      with:
        github-token: ${{ inputs.github-token }}
        environment: ${{ inputs.deployment-environment }}
        ref: ${{ github.sha }}
        target-url: https://${{ inputs.heroku-app-name }}.herokuapp.com
        description: Heroku
        pr-number: ${{ inputs.pr-number }}
