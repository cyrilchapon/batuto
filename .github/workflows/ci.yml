name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Checks (type, lint, format, assist, unused, depsync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run checks
        run: yarn check

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: batuto
          POSTGRES_PASSWORD: batuto
          POSTGRES_DB: batuto_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batuto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://batuto:batuto@localhost:5432/batuto_dev?schema=public
      WEB_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Apply database migrations
        run: yarn workspace @batuto/db migrate:deploy

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
