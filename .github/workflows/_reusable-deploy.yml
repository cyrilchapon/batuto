name: Reusable deploy (build -> release -> deploy)

# Shared by deploy-production.yml (main) and deploy-staging.yml (dev) — the
# two tiers are "exactly the same pipeline, different targets" per how this
# was scoped. Not used directly by PR review apps (deploy-preview.yml),
# which need a dynamically-created Heroku app and a linked Vercel preview,
# not a static gh-environment/vars.HEROKU_APP_NAME.
#
# Three strict phases: build-api and build-web run fully in parallel;
# release (database migrations, run directly against the real database —
# not via Heroku's release-phase dyno mechanism, deliberately: it's a
# plain, visible CI step, same pattern as db-checks.yml) only starts once
# *both* builds have succeeded; deploy-api and deploy-web (the actual
# platform deploys) only start once the release has succeeded, and run in
# parallel with each other. See infra-and-envs.md's "Imperative deploys"
# section.
on:
  workflow_call:
    inputs:
      gh-environment:
        description: GitHub Environment to scope vars/secrets to (Production | Staging)
        required: true
        type: string
      vercel-prod:
        description: Whether this is a Vercel production deploy (true) or a preview deploy (false)
        required: true
        type: boolean
      doppler-config:
        description: batuto-db Doppler config to pull the real BASE_DATABASE_URL from for migrations (dev | prd)
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # --- Build (parallel) ---

  build-api:
    name: Build API image (Docker)
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:login

      - name: Build image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker build -t "registry.heroku.com/$HEROKU_APP_NAME/web" -f apps/api/Dockerfile .

      - name: Push image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker push "registry.heroku.com/$HEROKU_APP_NAME/web"

  build-web:
    name: Build web (Vercel prebuilt)
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and env vars
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=${{ inputs.vercel-prod && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build ${{ inputs.vercel-prod && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-${{ inputs.gh-environment }}
          path: apps/web/.vercel/output
          retention-days: 1

  # --- Release ---
  # Waits on *both* builds — don't run migrations before knowing the web
  # build even works. Runs migrations directly against the real database
  # from this job (same yarn workspace @batuto/db migrate:deploy pattern
  # db-checks.yml already uses), not through Heroku's release-phase dyno —
  # a plain, visible CI step rather than something buried in a dyno's log
  # stream.

  release:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fetch Doppler secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: batuto-db
          doppler-config: ${{ inputs.doppler-config }}

      - name: Apply database migrations
        run: yarn workspace @batuto/db migrate:deploy
        env:
          DATABASE_URL: ${{ steps.doppler.outputs.BASE_DATABASE_URL }}

  # --- Deploy (parallel) ---
  # Both wait on release succeeding; neither waits on the other.

  deploy-api:
    name: Deploy API to Heroku
    runs-on: ubuntu-latest
    needs: release
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:login

      # container:release inspects the image via the local Docker daemon —
      # this job runs on a fresh runner from build-api's, so pull the
      # image build-api already pushed first.
      - name: Pull built image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker pull "registry.heroku.com/$HEROKU_APP_NAME/web"

      - name: Release (promote the built image)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: heroku container:release web --app "$HEROKU_APP_NAME"

  deploy-web:
    name: Deploy web to Vercel
    runs-on: ubuntu-latest
    needs: release
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-${{ inputs.gh-environment }}
          path: apps/web/.vercel/output

      - name: Deploy prebuilt to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          WORKING_DIRECTORY: apps/web
          PREBUILT: true
          PRODUCTION: ${{ inputs.vercel-prod }}
