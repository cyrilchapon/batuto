name: Reusable deploy (build -> release -> deploy)

# Shared by deploy-production.yml (main) and deploy-staging.yml (dev) — the
# two tiers are "exactly the same pipeline, different targets" per how this
# was scoped. Not used directly by PR review apps (deploy-preview.yml),
# which need a dynamically-created Heroku app and a linked Vercel preview,
# not a static gh-environment/vars.HEROKU_APP_NAME.
#
# Job graph: release-api (build + push + Heroku release, one job — the
# Heroku CLI's container:release needs the just-pushed images in the same
# Docker daemon it's inspecting, so build/push and release can't be split
# across separate runners) runs in parallel with build-web, then gates
# deploy-web (Vercel) — deploy only happens once the release has actually
# succeeded. See infra-and-envs.md's "Imperative deploys" section for why
# Heroku's release phase and web promotion can't be split into two
# separately CI-controlled steps the way build/deploy can for Vercel.
on:
  workflow_call:
    inputs:
      gh-environment:
        description: GitHub Environment to scope vars/secrets to (Production | Staging)
        required: true
        type: string
      vercel-prod:
        description: Whether this is a Vercel production deploy (true) or a preview deploy (false)
        required: true
        type: boolean

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  release-api:
    name: Build, push, and release API to Heroku
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:login

      - name: Build web image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker build --target web -t "registry.heroku.com/$HEROKU_APP_NAME/web" -f apps/api/Dockerfile .

      # FROM build, same as `web` — shares every cached layer, so this is
      # nearly free after the `web` build above.
      - name: Build release image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker build --target release -t "registry.heroku.com/$HEROKU_APP_NAME/release" -f apps/api/Dockerfile .

      - name: Push web image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker push "registry.heroku.com/$HEROKU_APP_NAME/web"

      - name: Push release image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: docker push "registry.heroku.com/$HEROKU_APP_NAME/release"

      # Heroku's actual release-phase mechanism: runs `release` (defined
      # by apps/api/Dockerfile's `release` stage CMD — `migrate:deploy`)
      # as a one-off dyno first, and only promotes `web` to the new
      # release if that exits 0. This is gated atomically by Heroku
      # itself, not a CI script's exit code — `heroku releases`/`heroku
      # rollback` work against the result same as any other Heroku
      # deploy. `container:release` blocks until release phase finishes
      # and fails the step (non-zero exit) if it does.
      - name: Release to Heroku (migrations, then promote web)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: heroku container:release web release --app "$HEROKU_APP_NAME"

  build-web:
    name: Build web (Vercel prebuilt)
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and env vars
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=${{ inputs.vercel-prod && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build ${{ inputs.vercel-prod && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-${{ inputs.gh-environment }}
          path: apps/web/.vercel/output
          retention-days: 1

  deploy-web:
    name: Deploy web to Vercel
    runs-on: ubuntu-latest
    needs: [release-api, build-web]
    environment: ${{ inputs.gh-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-${{ inputs.gh-environment }}
          path: apps/web/.vercel/output

      - name: Deploy prebuilt to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          WORKING_DIRECTORY: apps/web
          PREBUILT: true
          PRODUCTION: ${{ inputs.vercel-prod }}
