name: Build and test

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: batuto
          POSTGRES_PASSWORD: batuto
          POSTGRES_DB: batuto_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batuto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://batuto:batuto@localhost:5432/batuto_dev?schema=public
      WEB_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fetch Doppler secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: batuto-api
          doppler-config: stg

      - name: Apply database migrations
        run: yarn workspace @batuto/db migrate:deploy

      - name: Build
        run: yarn turbo run build

      - name: Test
        run: yarn turbo run test
        env:
          CLERK_SECRET_KEY: ${{ steps.doppler.outputs.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ steps.doppler.outputs.CLERK_PUBLISHABLE_KEY }}
