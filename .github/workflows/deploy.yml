name: Deploy

# Imperative, CI-driven deploys — not Vercel's or Heroku's own git-push
# auto-deploy. Both platforms' Git integrations must have auto-deploy
# disabled; this workflow is the only thing that ships `dev` to either
# environment. See infra-and-envs.md's "Hosting targets" section.
on:
  push:
    branches: [dev]

jobs:
  deploy-api:
    name: Deploy API to Heroku (Docker)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Doppler secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: batuto-deploy
          doppler-config: dev

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ steps.doppler.outputs.HEROKU_API_KEY }}
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build image
        env:
          HEROKU_APP_NAME: ${{ steps.doppler.outputs.HEROKU_APP_NAME }}
        run: docker build -t "registry.heroku.com/$HEROKU_APP_NAME/web" -f apps/api/Dockerfile .

      - name: Push image
        env:
          HEROKU_APP_NAME: ${{ steps.doppler.outputs.HEROKU_APP_NAME }}
        run: docker push "registry.heroku.com/$HEROKU_APP_NAME/web"

      - name: Release
        env:
          HEROKU_API_KEY: ${{ steps.doppler.outputs.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ steps.doppler.outputs.HEROKU_APP_NAME }}
        run: |
          IMAGE_ID=$(docker inspect "registry.heroku.com/$HEROKU_APP_NAME/web" --format='{{.Id}}')
          curl -fsS -X PATCH "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}"

  deploy-web:
    name: Deploy web to Vercel
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Doppler secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: batuto-deploy
          doppler-config: dev

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ steps.doppler.outputs.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.doppler.outputs.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.doppler.outputs.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ steps.doppler.outputs.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.doppler.outputs.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.doppler.outputs.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ steps.doppler.outputs.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.doppler.outputs.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.doppler.outputs.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
